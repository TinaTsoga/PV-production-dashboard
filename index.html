<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Παραγωγή &amp; Έσοδα Πάρκων</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2433;--mut:#6b7686;--line:#e4e8ef;--acc:#0f6fde;--up:#15803d;--down:#c0392b}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(120deg,#0b3a75,#0f6fde);color:#fff;padding:18px 20px 0}
header h1{margin:0 0 2px;font-size:20px}header p{margin:0 0 12px;opacity:.8;font-size:13px}
nav{display:flex;gap:4px}nav button{background:none;border:0;color:#cfe0fb;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0}
nav button.on{background:var(--bg);color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.bar label{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center}
select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:14px}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,50,.07)}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:26px;display:block;line-height:1.2}.kpi span{font-size:12px;color:var(--mut)}
h2{font-size:15px;margin:0 0 12px}.cv{position:relative;height:300px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600;font-size:12px;position:sticky;top:0;background:#fff}
tr.tot td{font-weight:700;background:#f7f9fc}.up{color:var(--up)}.down{color:var(--down)}.na{color:#aab2bf}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
#msg{background:#fff6e0;color:#7a5600;padding:8px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{border:0;background:#fff;padding:7px 14px;font:inherit;cursor:pointer}.seg button.on{background:var(--acc);color:#fff}
.view{display:none}.view.on{display:block}
@media(max-width:600px){.kpi b{font-size:22px}header h1{font-size:18px}}
.tag{background:var(--acc);color:#fff;border-radius:6px;padding:2px 10px;font-size:12px;font-weight:700}.tag.b{background:#64748b}
.btn{margin-left:auto;font:inherit;font-weight:600;padding:7px 14px;border:1px solid var(--acc);color:var(--acc);background:#fff;border-radius:8px;cursor:pointer}.btn.on{background:var(--acc);color:#fff}
.kpi .d{font-size:14px;font-weight:700;margin-top:4px}.kpi .d em{font-style:normal;font-weight:400;color:var(--mut)}
.sq{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}
.bar .fld{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center}
.ms{position:relative;display:inline-block}
.msb{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:128px;max-width:250px}
.msb .mst{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msb .car{font-size:11px;color:var(--mut)}
.msp{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;max-width:min(92vw,330px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(20,30,50,.16);padding:6px;z-index:60;max-height:340px;overflow:auto}
.ms.open .msp{display:block}.ms.open .msp.cols{display:grid;grid-template-columns:1fr 1fr}
.mso{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink);white-space:nowrap}.mso:hover{background:#f1f5fb}.mso input{accent-color:var(--acc)}
.mso.all{font-weight:600;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;margin-bottom:4px}.msp.cols .mso.all{grid-column:1/-1}
</style>
</head>

 const ex=A.m?' · '+partM(A):'';
 $('c3t').textContent='Ετήσια εξέλιξη — παραγωγή (kWh)'+ex;$('c4t').textContent='Ετήσια εξέλιξη — έσοδο (€)'+ex}
function y2y(){
 const p=$('yp').value,pf=r=>p=='*'||r.p==p,div=1,fld=mode=='kwh'?'k':'e';
 $('t2').textContent=(p=='*'?'Όλα τα πάρκα':p)+' — '+(mode=='kwh'?'παραγωγή (kWh)':'έσοδο (€)')+' ανά μήνα';
 const cell=(m,yy)=>{if(!has(r=>pf(r)&&r.y==yy&&r.m==m&&r[fld]!=null))return null;return sum(r=>pf(r)&&r.y==yy&&r.m==m,fld)/div};
 chart('c5','bar',MON,years.map((yy,i)=>({label:yy,backgroundColor:YC[i%YC.length],borderRadius:3,data:MON.map((_,m)=>cell(m+1,yy))})));
 const d=(a,b)=>a==null||b==null||b==0?'<td class="na">—</td>':`<td class="${a>=b?'up':'down'}">${a>=b?'▲':'▼'} ${nf(Math.abs((a-b)/b)*100,1)}%</td>`;
 let h='<tr><th>Μήνας</th>'+years.map(a=>`<th>${a}</th>`).join('')+years.slice(1).map((a,i)=>`<th>Δ% ${a} vs ${years[i]}</th>`).join('')+'</tr>';
 const dd=0,tot=years.map(()=>null);
 for(let m=1;m<=12;m++){const row=years.map(a=>cell(m,a));row.forEach((v,i)=>{if(v!=null)tot[i]=(tot[i]||0)+v});
  h+=`<tr><td>${MON[m-1]}</td>`+row.map(v=>`<td>${nf(v,dd)}</td>`).join('')+row.slice(1).map((v,i)=>d(v,row[i])).join('')+'</tr>'}
 h+='<tr class="tot"><td>ΣΥΝΟΛΟ</td>'+tot.map(v=>`<td>${nf(v,dd)}</td>`).join('')+tot.slice(1).map((v,i)=>d(v,tot[i])).join('')+'</tr>';
 $('ty').innerHTML=h+`<caption style="caption-side:bottom;text-align:left;color:#6b7686;font-size:12px;padding-top:8px">Οι μήνες χωρίς καταχώρηση δεν συγκρίνονται. Τα ετήσια σύνολα μπορεί να αφορούν ημιτελή έτη.</caption>`}
function dat(){
 const p=$('dp').value,y=$('dy').value;
 const rows=R.filter(r=>(p=='*'||r.p==p)&&(y=='*'||r.y==y)).sort((a,b)=>b.y-a.y||b.m-a.m||parks.indexOf(a.p)-parks.indexOf(b.p));
 $('td').innerHTML='<tr><th>Έτος</th><th>Μήνας</th><th>Πάρκο</th><th>Παραγωγή (kWh)</th><th>Κοινή είσπραξη (€)</th><th>Είσπραξη (€)</th><th>€/kWh</th></tr>'+
 rows.map(r=>`<tr><td>${r.y}</td><td>${MON[r.m-1]}</td><td><span class="dot" style="background:${pc(r.p)}"></span>${r.p}</td><td>${nf(r.k)}</td><td>${r.g?nf(r.g,2):'—'}</td><td>${nf(r.e,2)}</td><td>${r.k&&r.e?nf(r.e/r.k,4):'—'}</td></tr>`).join('')}
(async()=>{
 await load();parks=[...new Set(R.map(r=>r.p))];years=[...new Set(R.map(r=>r.y))].sort();
 const pItems=parks.map(q=>({v:q,t:q,c:pc(q)})),mItems=MON.map((n,i)=>({v:i+1,t:n})),yItems=years.map(y=>({v:y,t:String(y)})),last=[years[years.length-1]],cb=()=>dash();
 msCreate('dp0',pItems,'Όλα τα πάρκα','πάρκα',{none:'Κανένα πάρκο',onchange:cb});msCreate('dm',mItems,'Όλοι οι μήνες','μήνες',{cols:1,none:'Κανένας μήνας',onchange:cb});msCreate('yr',yItems,'Όλα τα έτη','έτη',{init:last,none:'Κανένα έτος',onchange:cb});
 msCreate('bp',pItems,'Όλα τα πάρκα','πάρκα',{none:'Κανένα πάρκο',onchange:cb});msCreate('bm',mItems,'Όλοι οι μήνες','μήνες',{cols:1,none:'Κανένας μήνας',onchange:cb});msCreate('by',yItems,'Όλα τα έτη','έτη',{init:last,none:'Κανένα έτος',onchange:cb});
 $('cyyb').onchange=dash;
 $('cbtn').onclick=()=>{comp=!comp;$('barB').style.display=comp?'flex':'none';$('cbtn').classList.toggle('on',comp);$('cbtn').textContent=comp?'✕ Κατάργηση Σύγκρισης':'＋ Προσθήκη Σύγκρισης';
  if(comp){MS.bp.set(MS.dp0.arr());MS.bm.set(MS.dm.arr());const ay=MS.yr.arr(),i=years.indexOf(ay[0]);MS.by.set(ay.length==1&&i>0?[years[i-1]]:ay)}
  closeMS();dash()};
 fillSel('yp',parks,'Όλα τα πάρκα');fillSel('dp',parks,'Όλα τα πάρκα');fillSel('dy',[...years].reverse(),'Όλα τα έτη');
 $('yp').onchange=y2y;$('dp').onchange=$('dy').onchange=dat;
 $('ym').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;[...$('ym').children].forEach(x=>x.classList.toggle('on',x==b));y2y()};
 document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==b.dataset.v))};
 dash();y2y();dat()})();
</script>
